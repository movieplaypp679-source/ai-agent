name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ./AI-Agent-v2.9.1-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./AI-Agent-v2.9-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./AI-Agent-v2.8-debug.apk

      - name: Create Clean Project ZIP
        run: |
          zip -r ./AI_Agent_Phase10_v2.9.1_updated.zip app settings.gradle build.gradle PHASE10_NOTES*.md -x "app/build/*" "*.git*"
          zip -r ./AI_Agent_Phase10_v2.9_updated.zip app settings.gradle build.gradle PHASE10_NOTES*.md -x "app/build/*" "*.git*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-v2.9.1-release-files
          path: |
            ./AI-Agent-v2.9.1-debug.apk
            ./AI_Agent_Phase10_v2.9.1_updated.zip
            ./AI-Agent-v2.9-debug.apk
            ./AI_Agent_Phase10_v2.9_updated.zip
          retention-days: 14

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.9.1 ./AI-Agent-v2.9.1-debug.apk ./AI_Agent_Phase10_v2.9.1_updated.zip --title "AI Agent v2.9.1" --notes "v2.9.1: No-template Godot 4 custom game generator, context overflow prompt trim, and temperature tuning." || gh release upload v2.9.1 ./AI-Agent-v2.9.1-debug.apk ./AI_Agent_Phase10_v2.9.1_updated.zip --clobber
          gh release upload v2.9 ./AI-Agent-v2.9-debug.apk ./AI_Agent_Phase10_v2.9_updated.zip --clobber || true
