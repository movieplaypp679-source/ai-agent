name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ./AI-Agent-v2.6-debug.apk

      - name: Create Clean Project ZIP
        run: |
          zip -r ./AI_Agent_Phase9_v2.6_updated.zip app settings.gradle build.gradle -x "app/build/*" "*.git*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-v2.6-release-files
          path: |
            ./AI-Agent-v2.6-debug.apk
            ./AI_Agent_Phase9_v2.6_updated.zip
          retention-days: 14

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.6 ./AI-Agent-v2.6-debug.apk ./AI_Agent_Phase9_v2.6_updated.zip --clobber
